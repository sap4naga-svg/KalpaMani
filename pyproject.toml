[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalpamani"
version = "0.1.0"
description = "KalpaMani - autonomous long/short U.S. equity swing & momentum trading system with deterministic risk and bounded AI research."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "KalpaMani" }]
keywords = ["quantitative-trading", "swing-trading", "momentum", "equities"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
]

# Bootstrap phase: intentionally zero runtime dependencies.
# No brokerage, market-data or AI client libraries are installed yet.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kalpamani*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast, isolated tests with no external dependencies",
    "integration: tests that cross module boundaries; still no brokerage",
    "broker: tests that require a brokerage connection (NONE may run at bootstrap)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert is expected in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# LEAN algorithms run inside the LEAN Docker container, where
# `from AlgorithmImports import *` is the officially prescribed idiom and the
# names it provides do not exist locally. Not type-checked either (mypy `files`
# covers src and tests only).
"lean/projects/**" = ["F403", "F405"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
