[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalpamani"
version = "0.1.0"
description = "KalpaMani - autonomous long/short U.S. equity swing & momentum trading system with deterministic risk and bounded AI research."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "KalpaMani" }]
keywords = ["quantitative-trading", "swing-trading", "momentum", "equities"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
]

# ONE runtime dependency, added by ADR-0011 for the licensed S3 object store.
#
# The zero-dependency posture held from bootstrap through the A1 kernel and the
# provider-integration slice, and it is given up deliberately rather than
# incidentally. A store that writes to S3 must sign requests, resolve credentials
# and honour retry semantics, and none of that may be hand-written: SigV4
# implemented here would be a security-critical component with no review surface
# and no upstream fixes.
#
# `boto3` only. No brokerage, market-data, AI, data-engine or emulator library is
# installed, and a static test still refuses every one of them. The floor is the
# first release whose S3 model carries conditional `PutObject` through
# `IfNoneMatch`, which is the mechanism the store's append-only guarantee rests
# on; the ceiling keeps a major-version change a reviewed decision.
#
# **Nothing in `src/` imports it.** The S3 client is injected everywhere,
# including in the dormant composition root (ADR-0014), which builds the licensed
# store from a client a caller hands it. The SDK is needed to *construct* that
# client -- and no module does, because no credential source and no authorized
# runner exists. Importing the data platform stays SDK-free and network-silent.
dependencies = [
    "boto3>=1.36.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kalpamani*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast, isolated tests with no external dependencies",
    "integration: tests that cross module boundaries; still no brokerage",
    "broker: tests that require a brokerage connection (NONE may run at bootstrap)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert is expected in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# LEAN algorithms run inside the LEAN Docker container, where
# `from AlgorithmImports import *` is the officially prescribed idiom and the
# names it provides do not exist locally. Not type-checked either (mypy `files`
# covers src and tests only).
"lean/projects/**" = ["F403", "F405"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
# `scripts/` is not in `files`: the operational scripts predate strict typing and
# checking them is a separate decision. It is on the *path* so a test that imports
# one -- the offline plan-check command does -- resolves it instead of reporting a
# missing stub, which would be an error about the configuration rather than about
# the code.
mypy_path = ["scripts"]
strict = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
